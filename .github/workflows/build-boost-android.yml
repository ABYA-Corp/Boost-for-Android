name: Build Boost 1.90 Android (custom libs)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BOOST_VERSION: 1.90.0
      NDK_VERSION: 26.1.10909125

    steps:
      - name: Checkout repo (tu fork)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            curl \
            unzip

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux.zip
          unzip android-ndk-r${NDK_VERSION}-linux.zip
          echo "NDK_ROOT=$PWD/android-ndk-r${NDK_VERSION}" >> $GITHUB_ENV

      - name: Make script executable
        run: chmod +x build-android.sh

      - name: Build Boost (only required libs)
        run: |
          ./build-android.sh \
            --boost=${BOOST_VERSION} \
            --with-libraries=chrono,thread,iostreams,date_time,filesystem,atomic,system \
            --arch=arm64-v8a \
            $NDK_ROOT

      - name: Verify built libraries
        run: |
          find build -name "libboost*.a"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boost-android-${{ env.BOOST_VERSION }}
          path: build